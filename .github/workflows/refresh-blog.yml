name: Refresh blog posts

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the Hashnode RSS feed
        run: node scripts/fetch-blog.mjs
      - name: Commit if the posts changed
        run: |
          if git diff --quiet -- src/data/blog-posts.ts; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-posts.ts
          git commit -m "chore(blog): refresh posts from Hashnode RSS"
          git push
